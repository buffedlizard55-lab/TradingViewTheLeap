name: Capture intraday market data

# Intraday ingestion pipeline for the stock-division research: hourly and 15-minute bars
# for the 20-stock volatile pool plus hourly futures for the symbols already captured
# daily. Runs on a GitHub-hosted runner because the repository's own sandbox has no egress
# to the market-data vendor (only the package index and api.github.com are reachable there).
#
# Runner IP ranges are rate limited by the vendor (HTTP 429), so scripts/fetch_intraday.py
# chunks every request window, disables direct calls after repeated 429s, and falls back to
# public relays. Payloads are validated (symbol, granularity, OHLC invariants) before a
# single bar is stored; the offline verifier re-audits the committed files afterwards.
#
# Dispatch inputs let a single interval be captured on its own, which is how a partial
# top-up is done after a rate-limited run:
#   gh workflow run capture-intraday.yml -f interval=1h
#
# Interval order matters. The steps run long daily bars first, then hourly, then 15-minute:
# daily is the cheapest (fewest requests per symbol) and the most valuable (it is what the
# stock division's season arithmetic is built on), so a run that gets rate limited part-way
# through still commits usable data. Every step is also bounded by --time-budget-seconds and
# commits on its own, because the vendor caps requests per runner IP range: an unbounded
# 15-minute sweep alone can occupy the whole job and commit nothing.

on:
  workflow_dispatch:
    inputs:
      interval:
        description: "Which interval to capture"
        required: false
        default: all
        type: choice
        options: [all, 15m, 1h, 1d]
      only_failed:
        description: "Only retry series not yet captured"
        required: false
        default: true
        type: boolean
  # Push-triggered runs were removed on 2026-09-19: every edit to the fetch script restarted
  # this 2-hour serial job (cancel-in-progress) and competed with the per-symbol matrix
  # workflow for the vendor's per-IP budget. Use capture-intraday-matrix.yml (cron + dispatch)
  # for routine top-ups; dispatch this serial lane only for a single-interval retry.

permissions:
  contents: write

concurrency:
  # A superseded run must not occupy the single slot until its 120-minute job timeout: that is
  # exactly what happened on 2026-09-18, when a rate-limited sweep blocked every later run and
  # committed nothing. Each run is resumable through --only-failed, so cancelling the older one
  # is strictly better than waiting for it.
  group: capture-intraday-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Fetch intraday bars for the volatile stock pool
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide which intervals to capture
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "interval=${{ inputs.interval }}" >> "$GITHUB_OUTPUT"
          else
            echo "interval=all" >> "$GITHUB_OUTPUT"
          fi
          if [ -f data/intraday_index.json ]; then
            echo "extra=--only-failed" >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Vendor reachability probe (annotations only, never fails the job)
        continue-on-error: true
        run: |
          for host in query1 query2; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              "https://${host}.finance.yahoo.com/v8/finance/chart/NVDA?range=5d&interval=15m" || echo "curl-error")
            echo "::notice::probe ${host}.finance.yahoo.com -> HTTP ${code}"
          done

      - name: Compile check
        run: python3 -m py_compile scripts/fetch_intraday.py

      - name: Capture long daily bars (20-stock volatile pool, ~10 years)
        if: steps.plan.outputs.interval == 'all' || steps.plan.outputs.interval == '1d'
        continue-on-error: true
        env:
          CAPTURE_ENV: github-actions
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          python3 scripts/fetch_intraday.py --interval 1d ${{ steps.plan.outputs.extra }} \
            --out-dir data/intraday --index data/intraday_index.json --pacing-seconds 0.5 \
            --time-budget-seconds 900 2>&1 | tee -a /tmp/capture_log.txt
      - name: Commit long daily capture (fails the job if the push fails)
        if: always()
        run: |
          bash .github/scripts/commit_capture.sh \
            "capture: long daily bars for the volatile stock pool (automated)" \
            data/intraday data/intraday_index.json
      - name: Capture hourly bars (20 stocks + 20 futures, last ~730 days)
        if: steps.plan.outputs.interval == 'all' || steps.plan.outputs.interval == '1h'
        continue-on-error: true
        env:
          CAPTURE_ENV: github-actions
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          python3 scripts/fetch_intraday.py --interval 1h ${{ steps.plan.outputs.extra }} \
            --futures-hourly --out-dir data/intraday --index data/intraday_index.json \
            --pacing-seconds 0.5 --time-budget-seconds 1500 2>&1 | tee -a /tmp/capture_log.txt
      - name: Commit hourly capture (fails the job if the push fails)
        if: always()
        run: |
          bash .github/scripts/commit_capture.sh \
            "capture: hourly bars for stocks and futures (automated)" \
            data/intraday data/intraday_index.json
      - name: Capture 15-minute bars (20-stock volatile pool, last ~60 days)
        if: steps.plan.outputs.interval == 'all' || steps.plan.outputs.interval == '15m'
        continue-on-error: true
        env:
          CAPTURE_ENV: github-actions
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          python3 scripts/fetch_intraday.py --interval 15m ${{ steps.plan.outputs.extra }} \
            --out-dir data/intraday --index data/intraday_index.json --pacing-seconds 0.5 \
            --time-budget-seconds 1500 2>&1 | tee -a /tmp/capture_log.txt
      - name: Commit 15-minute capture (fails the job if the push fails)
        if: always()
        run: |
          bash .github/scripts/commit_capture.sh \
            "capture: 15-minute bars for the volatile stock pool (automated)" \
            data/intraday data/intraday_index.json
      - name: Capture summary (fails the job only if nothing at all was captured)
        run: |
          python3 - <<'PY'
          import json, os, sys
          if not os.path.exists("data/intraday_index.json"):
              print("::error::no intraday index written at all")
              sys.exit(1)
          idx = json.load(open("data/intraday_index.json"))
          meta = idx["_meta"]
          ok = [c for c in idx["captures"] if c["status"] == "captured"]
          bad = [c for c in idx["captures"] if c["status"] != "captured"]
          print(f"captured={len(ok)} failed={len(bad)} by_interval={meta['captured_by_interval']}")
          for c in bad:
              print(f"::warning::{c['symbol']} [{c['interval']}] {c.get('error','')[:180]}")
          by_iv = {}
          for c in ok:
              by_iv.setdefault(c["interval"], []).append(f"{c['symbol']}={c['bar_count']}")
          for iv, rows in sorted(by_iv.items()):
              print(f"::notice::{iv} bars: " + ", ".join(rows))
          if not ok:
              print("::error::intraday capture stored zero series")
              sys.exit(1)
          PY

      - name: Capture run diagnostics (always runs; posts its findings as a commit comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/capture_diagnostics.py
          bash .github/scripts/commit_capture.sh \
            "capture: intraday capture run report (automated)" \
            data/intraday_capture_report.json

      - name: Final safety commit (in case a step's own commit was interrupted)
        run: |
          bash .github/scripts/commit_capture.sh \
            "capture: intraday (+ long daily) bars for the volatile stock pool (automated)" \
            data/intraday data/intraday_index.json

      - name: Upload captures as artifact (secondary channel)
        uses: actions/upload-artifact@v4
        with:
          name: intraday-captures
          path: |
            data/intraday
            data/intraday_index.json
          retention-days: 30
          if-no-files-found: warn
