name: Derive intraday research artifacts

# Runs whenever the capture workflow commits new intraday bars (data/intraday_index.json or a
# file under data/intraday/), re-derives everything that depends on them, and commits the result
# back to the same branch:
#
#   data/intraday_study.json            gap-fill + execution-latency measurement
#   data/stock_competition_results.json volatile-stock division (our own multi-season paper comp)
#   data/exec_summary.json              mechanical "what gets placed next" table
#   data/tv_benchmark.json              Pine broker-emulator vs Python fill benchmark
#   data/intelligence_report.json        status/provenance layer (absorbs the new artifacts)
#   index.html                           the GitHub Pages document
#
# This is the "no manual step" half of the intraday pipeline: the capture job stores vendor bars
# with per-chunk digests, this job turns them into audited research artifacts, and the verifier
# re-derives every number from the stored bars afterwards. A commit made with the workflow token
# does not re-trigger workflows, so this cannot loop.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "data/intraday_index.json"
      - "data/intraday/**"

permissions:
  contents: write

concurrency:
  group: derive-intraday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  derive:
    name: Re-derive the intraday-dependent research artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check
        run: python3 -m py_compile scripts/run_intraday_study.py scripts/run_stock_competition.py scripts/build_exec_summary.py scripts/tv_benchmark.py scripts/build_intelligence.py scripts/build_site.py

      - name: Intraday gap-fill / latency study
        run: python3 scripts/run_intraday_study.py

      - name: Volatile-stock division (multi-season paper competition)
        run: python3 scripts/run_stock_competition.py

      - name: Executive-summary orders
        run: python3 scripts/build_exec_summary.py

      - name: TradingView export benchmark (reports 'blocked' without a real export)
        run: python3 scripts/tv_benchmark.py

      - name: Intelligence layer + site
        run: |
          python3 scripts/build_intelligence.py
          python3 scripts/build_site.py

      - name: Verify the repository before committing
        run: python3 scripts/verify.py

      - name: Commit the derived artifacts
        run: |
          git config user.name "github-actions[derive]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday_study.json data/stock_competition_results.json \
                  data/exec_summary.json data/tv_benchmark.json \
                  data/intelligence_report.json index.html
          if git diff --cached --quiet; then
            echo "::notice::no derived artifact changed"
            exit 0
          fi
          git commit -m "derive: intraday study, stock division, exec summary, site (automated)"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::notice::derived artifacts committed to ${GITHUB_REF_NAME}"
          else
            # A capture run may have committed while this job was deriving. -X theirs during a
            # rebase keeps the artifacts this job just re-derived (they are strictly newer), and
            # the same conflict policy is used by .github/scripts/commit_capture.sh, so the two
            # lanes cannot deadlock against each other.
            echo "::notice::push rejected - rebasing onto origin/${GITHUB_REF_NAME} and retrying"
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload derived artifacts (secondary channel)
        uses: actions/upload-artifact@v4
        with:
          name: intraday-derived
          path: |
            data/intraday_study.json
            data/stock_competition_results.json
            data/exec_summary.json
            data/tv_benchmark.json
          retention-days: 30
          if-no-files-found: warn
