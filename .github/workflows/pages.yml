name: Verify research data

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
  # A commit made with the workflow token does not re-trigger workflows, so when the
  # "Derive intraday research artifacts" lane commits freshly derived artifacts the verify
  # run that was already racing it stays red with no green successor (observed on main at
  # cca9b0d: verify failed on the pre-derive tree while derive was committing 11851d0).
  # Re-running here closes that gap. IR-31.
  workflow_run:
    workflows: ["Derive intraday research artifacts"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    name: Verify research data and site freshness
    runs-on: ubuntu-latest
    steps:
      # For a workflow_run event, check out the commit the derive lane produced, not the
      # default branch. fetch-depth: 0 because that SHA is not the tip of any local ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the research verifier (with self-test)
        run: python3 scripts/verify.py --self-test

      - name: Rebuild target arithmetic
        run: |
          python3 scripts/target_lab.py
          git diff --exit-code -- data/target_lab.json

      - name: Rebuild intelligence report
        run: |
          python3 scripts/build_intelligence.py
          git diff --exit-code -- data/intelligence_report.json

      - name: Re-derive the intraday-dependent artifacts (skipped when no captures exist)
        run: |
          if [ ! -f data/intraday_index.json ]; then
            echo "::notice::no data/intraday_index.json committed - the intraday study, stock division and exec summary cannot be re-derived"
            exit 0
          fi
          python3 scripts/run_intraday_study.py
          python3 scripts/run_stock_competition.py
          python3 scripts/build_exec_summary.py
          python3 scripts/tv_benchmark.py
          if ! git diff --quiet -- data/intraday_study.json data/stock_competition_results.json \
               data/exec_summary.json data/tv_benchmark.json; then
            echo "::error::an intraday-derived artifact is stale with respect to data/intraday/. Re-run scripts/run_intraday_study.py, scripts/run_stock_competition.py, scripts/build_exec_summary.py, scripts/tv_benchmark.py and commit the result."
            git diff --stat -- data/intraday_study.json data/stock_competition_results.json data/exec_summary.json data/tv_benchmark.json
            exit 1
          fi
          echo "intraday-derived artifacts are in sync with the captures."

      - name: Rebuild the site from data
        run: python3 scripts/build_site.py

      - name: Fail if the committed site is stale
        run: |
          if ! git diff --quiet -- index.html docs/index.html docs/assets; then
            echo "::error::index.html or its docs/ mirror is out of date with data/. Run 'python3 scripts/build_site.py' and commit the result."
            git diff --stat -- index.html docs/index.html docs/assets
            exit 1
          fi
          echo "index.html and its docs/ mirror are in sync with data/ and research/."

      - name: Test return-target lab
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Confirm key datasets render completely
        run: |
          python3 - <<'PY'
          import html as html_lib
          import json, re
          html = open("index.html", encoding="utf-8").read()
          cfg = json.load(open("data/contest_config.json"))
          snapshot = json.load(open("data/live_contest_snapshot.json"))
          capacity = json.load(open("data/initial_capacity.json"))
          uni = json.load(open("data/contest_universe.json"))
          ml = json.load(open("data/master_list.json"))
          er = json.load(open("data/verified_explosive_returns.json"))
          stocks = json.load(open("data/volatile_stocks.json"))
          models = json.load(open("research/strategy/models.json"))
          sources = json.load(open("research/sources/sources.json"))
          frontier = json.load(open("data/frontier_history.json"))
          intelligence = json.load(open("data/intelligence_report.json"))
          market_idx = json.load(open("data/market_history_index.json"))
          backtests = json.load(open("data/backtest_results.json"))
          vol = json.load(open("data/volatility_intelligence.json"))
          import os

          def opt(rel):
              return json.load(open(rel)) if os.path.exists(rel) else None

          probs = []
          # The executive summary must be rendered from the generated artifact, never hardcoded:
          # count the order rows against the artifact and require every pending symbol to appear.
          es = opt("data/exec_summary.json")
          if es:
              n_ord = len(re.findall(r'data-ord="', html))
              if n_ord != es["_meta"]["pending_order_count"]:
                  probs.append(f"exec-summary order rows {n_ord} != {es['_meta']['pending_order_count']} pending orders")
              for div_name, div in es["divisions"].items():
                  for rec in div.get("recommendations", []):
                      if rec["username"] not in html:
                          probs.append(f"exec-summary username {rec['username']} missing from page")
                      for order in rec.get("pending_orders", []):
                          if order["symbol"] not in html:
                              probs.append(f"exec-summary order symbol {order['symbol']} missing from page")
          study = opt("data/intraday_study.json")
          if study:
              n_cov = len(re.findall(r'data-icov="', html))
              if n_cov != len(study["coverage"]):
                  probs.append(f"intraday coverage rows {n_cov} != {len(study['coverage'])} captured series")
          stock_comp = opt("data/stock_competition_results.json")
          if stock_comp:
              n_srow = len(re.findall(r'data-srow="', html))
              want_srow = sum(len(d.get("leaderboard") or []) for d in stock_comp["divisions"].values())
              if n_srow != want_srow:
                  probs.append(f"stock-division rows {n_srow} != {want_srow} leaderboard rows")
          tvb = opt("data/tv_benchmark.json")
          if tvb:
              if tvb["_meta"]["status"] not in html:
                  probs.append(f"TV benchmark status {tvb['_meta']['status']!r} missing from page")
              if "fixture" in json.dumps(tvb["fixtures"]) and "SYNTHETIC" not in html:
                  probs.append("synthetic-fixture notice missing from page")
          for banned in ("Upcoming Trade Signal Matrix",):
              if banned in html:
                  probs.append(f"hardcoded block {banned!r} is back in the page")
          n_uni = len(re.findall(r'data-ex="', html))
          if n_uni != len(uni["instruments"]):
              probs.append(f"universe rows {n_uni} != {len(uni['instruments'])}")
          n_ml = len(re.findall(r'data-class="', html))
          if n_ml != len(ml["entries"]):
              probs.append(f"master rows {n_ml} != {len(ml['entries'])}")
          n_capacity = len(re.findall(r'data-group="', html))
          if n_capacity != len(capacity["entries"]):
              probs.append(f"capacity rows {n_capacity} != {len(capacity['entries'])}")
          n_stocks = len(re.findall(r'data-mult="', html))
          if n_stocks != len(stocks["records"]):
              probs.append(f"stock rows {n_stocks} != {len(stocks['records'])}")
          n_models = html.count('<article class="card strategy-card">')
          if n_models != len(models["models"]):
              probs.append(f"strategy cards {n_models} != {len(models['models'])}")
          n_frontier = len(re.findall(r'data-frontier="', html))
          if n_frontier != len(frontier["captures"]):
              probs.append(f"frontier rows {n_frontier} != {len(frontier['captures'])}")
          n_mh = len(re.findall(r'data-mhsym="', html))
          expected_mh = sum(1 for c in market_idx["captures"] if c.get("status") == "captured")
          if n_mh != expected_mh:
              probs.append(f"market-history rows {n_mh} != {expected_mh} captured symbols")
          n_vol = len(re.findall(r'data-vol="', html))
          if n_vol != len(vol["records"]):
              probs.append(f"volatility rows {n_vol} != {len(vol['records'])}")
          n_verdicts = len(re.findall(r'data-verdict="', html))
          if n_verdicts != len(backtests["models"]):
              probs.append(f"backtest cards {n_verdicts} != {len(backtests['models'])}")
          comp = json.load(open("data/competition_results.json"))
          n_shadow = len(re.findall(r'data-shadow="', html))
          if n_shadow != len(comp["leaderboard"]):
              probs.append(f"shadow leaderboard rows {n_shadow} != {len(comp['leaderboard'])}")
          n_cstrat = len(re.findall(r'data-cstrat="', html))
          if n_cstrat != len(comp["models"]):
              probs.append(f"shadow model cards {n_cstrat} != {len(comp['models'])}")
          if comp["_meta"]["generated_utc"] not in html:
              probs.append("shadow-competition stamp missing from page")
          for row in comp["leaderboard"]:
              if row["username"] not in html:
                  probs.append(f'shadow username {row["username"]} missing from page')
          for required in (cfg["edition_label"], frontier["captures"][-1]["captured_at_utc"],
                           backtests["_meta"]["generated_utc"], intelligence["_meta"]["generated_utc"]):
              if required not in html:
                  probs.append(f"required live-edition value {required!r} missing")
          for m in backtests["models"]:
              if m["verdict"] not in html:
                  probs.append(f'verdict {m["verdict"]} missing from page')
          for sym in (x["symbol"] for x in ml["entries"]):
              if sym not in html:
                  probs.append(f"master symbol {sym} missing from page")
          for r in er["records"]:
              if f'{r["return_multiple"]}x' not in html:
                  probs.append(f'return {r["return_multiple"]}x missing from page')
          for record in stocks["records"]:
              for window in ("trough_window", "peak_window"):
                  endpoint = html_lib.escape(record[window]["endpoint"], quote=True)
                  if endpoint not in html:
                      probs.append(f'{record["symbol"]} {window} endpoint missing')
          for source in sources["sources"]:
              if source["source_id"] not in html:
                  probs.append(f'source {source["source_id"]} missing from page')
          # Python-side leak signatures. A bare substring search for "nan"
          # false-positives on "finance" and "BenBernanke", so match the shapes a
          # leaked value actually takes.
          leaked = re.findall(r">\s*(?:None|nan|NaN|Infinity|undefined)\s*<|\bnanx\b|\bnan%|\$\s*nan", html)
          if leaked:
              probs.append(f"a Python value leaked into the rendered page: {leaked[:5]}")

          # "null" is rendered deliberately in two shapes: an explicit null pill in
          # table cells, and <code>null</code> in the prose that explains the policy.
          # Anything else is a leaked value.
          bare_null = (html.count(">null<")
                       - html.count('<span class="pill mut">null</span>')
                       - html.count("<code>null</code>"))
          if bare_null:
              probs.append(f"{bare_null} bare 'null' rendered outside a pill or <code> tag")
          if probs:
              print("::error::" + "; ".join(probs))
              raise SystemExit(1)
          print(f"OK: {n_uni} universe, {n_ml} selected, {n_capacity} capacity, "
                f"{len(er['records'])} contest-return, {n_stocks} stock, "
                f"{n_models} strategy, {n_frontier} frontier, {n_mh} market-history, "
                f"{n_vol} volatility, {n_verdicts} backtest, and "
                f"{len(sources['sources'])} source records rendered.")
          PY

# NOTE ON PUBLISHING
# This repository's GitHub Pages site is configured in LEGACY mode against branch `main`
# at path `/` (GET /repos/{owner}/{repo}/pages). Switching it to Actions-based deployment
# requires pages:write, which this credential does not have:
#   PUT /repos/{owner}/{repo}/pages  ->  403 Resource not accessible by integration
# Because legacy Pages builds from the root of `main`, scripts/build_site.py writes
# index.html and assets/ at the repository root, and Pages publishes them on merge to main
# with no deploy job and no settings change required.
#
# To move to Actions-based deployment instead, a repository admin should run:
#   gh api -X PUT repos/{owner}/{repo}/pages -f build_type=workflow
# and then restore an actions/upload-pages-artifact + actions/deploy-pages job here.
